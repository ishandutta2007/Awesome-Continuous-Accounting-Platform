<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas & Grid Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Animated Glowing Background Orbs (Dynamic Aspect) -->
  <circle cx="150" cy="80" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="80;120;80" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.25;0.15" dur="6s" repeatCount="indefinite" />
  </circle>

  <circle cx="1050" cy="280" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="280;240;280" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Dynamic Flow Lines (Background Layer - Behind Text) -->
  <g opacity="0.25">
    <path d="M -50 220 Q 200 120 450 240 T 950 160 T 1250 260" fill="none" stroke="url(#accent-cyan)" stroke-width="3" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;-64" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M -50 260 Q 300 320 600 180 T 1100 240 T 1250 140" fill="none" stroke="url(#accent-purple)" stroke-width="2">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Dashboard Feature Cards (Right Side Background/Midground, low opacity to preserve foreground clarity) -->
  <g transform="translate(820, 45)" filter="url(#shadow)" opacity="0.85">
    <!-- Card 1: Reconciled Status -->
    <rect x="0" y="0" width="320" height="70" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="35" cy="35" r="16" fill="#10b981" opacity="0.2" />
    <circle cx="35" cy="35" r="8" fill="#10b981">
      <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="65" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Continuous Reconciliation</text>
    <text x="65" y="50" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">✓ 99.8% Auto-Matched</text>

    <!-- Card 2: Real-time Close -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="320" height="70" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#3b82f6" opacity="0.2" />
      <path d="M 28 35 L 33 40 L 42 29" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="65" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Financial Close Automation</text>
      <text x="65" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Day 1 Audit Ready</text>
    </g>

    <!-- Card 3: Real-Time Ledger -->
    <g transform="translate(-10, 180)">
      <rect x="0" y="0" width="320" height="70" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#8b5cf6" opacity="0.2" />
      <text x="35" y="40" fill="#8b5cf6" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
      <text x="65" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Real-Time ERP &amp; GL Engine</text>
      <text x="65" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">SaaS &amp; Open-Source Stack</text>
    </g>
  </g>

  <!-- Foreground Main Content (Title and Subtitle - Unobscured & High Contrast) -->
  <g transform="translate(60, 0)">
    <!-- Badge Pill above Title -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="260" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#3b82f6">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Continuous
    </text>
    <text x="0" y="195" fill="url(#accent-cyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      Accounting Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Curated List of SaaS Platforms &amp; Open-Source Projects for Financial Close
    </text>
    <text x="0" y="265" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Automation, Transaction Matching, Consolidation &amp; Real-Time Reporting
    </text>

    <!-- Interactive/Feature Tag Pills below subtitle -->
    <g transform="translate(0, 295)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="65" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">💼 SaaS Leaders</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="220" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">⚡ Open-Source Stacks</text>

      <!-- Pill 3 -->
      <rect x="310" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="385" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🤖 AI Close Automation</text>
    </g>
  </g>
</svg>
